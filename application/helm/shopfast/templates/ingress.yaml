{{- include "shopfast.validateStrategy" . -}}
{{- if .Values.ingress.enabled }}
{{/*
Public ingress served by ingress-nginx behind the platform NLB.

TLS: cert-manager watches the cert-manager.io/cluster-issuer annotation plus
the spec.tls block, obtains a Let's Encrypt certificate over HTTP-01 and writes
it into the named Secret. Nothing here references an ACM ARN.

ssl-redirect is set PER INGRESS rather than globally in the controller config:
ingress-nginx exempts the /.well-known/acme-challenge/ path from a per-ingress
redirect, so renewals keep working, whereas a global force-ssl-redirect would
break the challenge and no certificate would ever issue.

CANARY: this is the STABLE ingress. When deploymentStrategy=canary, the Argo
Rollouts nginx traffic router COPIES this ingress into a second, managed
"-canary" ingress carrying nginx.ingress.kubernetes.io/canary: "true" and the
current canary-weight. That copy is owned by the Rollouts controller — the
chart must not render it, or the two would fight.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shopfast.fullname" . }}
  labels:
    {{- include "shopfast.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ include "shopfast.fullname" . }}-tls
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "shopfast.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- if and (eq .Values.deploymentStrategy "bluegreen") .Values.ingress.previewHost }}
---
{{/*
Preview hostname: verify the green stack publicly before promoting it.
Gets its own certificate — HTTP-01 cannot issue wildcards, so each hostname
needs its own Secret.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shopfast.fullname" . }}-preview
  labels:
    {{- include "shopfast.labels" . | nindent 4 }}
    shopfast.io/role: preview
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.ingress.previewHost | quote }}
      secretName: {{ include "shopfast.fullname" . }}-preview-tls
  rules:
    - host: {{ .Values.ingress.previewHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "shopfast.fullname" . }}-preview
                port:
                  number: {{ .Values.service.port }}
{{- end }}
{{- end }}
