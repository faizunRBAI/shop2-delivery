{{- include "shopfast.validateStrategy" . -}}
{{/*
STANDARD MODE ONLY.

This template renders a plain Kubernetes Deployment and is guarded so that it
is skipped entirely whenever deploymentStrategy is bluegreen or canary. That
guard is the contract: when a Rollout owns the workload, no Deployment exists
to fight it for the same ReplicaSets.
*/}}
{{- if eq .Values.deploymentStrategy "standard" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shopfast.fullname" . }}
  labels:
    {{- include "shopfast.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "shopfast.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    {{- include "shopfast.podSpec" . | nindent 4 }}
{{- end }}
