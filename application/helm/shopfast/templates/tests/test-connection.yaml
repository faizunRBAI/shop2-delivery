apiVersion: v1
kind: Pod
metadata:
  name: {{ include "shopfast.fullname" . }}-test-connection
  labels:
    {{- include "shopfast.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: curlimages/curl:8.11.0
      command: ["/bin/sh", "-c"]
      args:
        - >-
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors
          http://{{ include "shopfast.fullname" . }}:{{ .Values.service.port }}/actuator/health
          && curl -fsS
          http://{{ include "shopfast.fullname" . }}:{{ .Values.service.port }}/api/hello
