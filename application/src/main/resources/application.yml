spring:
  application:
    name: shopfast

server:
  port: 8080
  shutdown: graceful

# Give in-flight requests time to drain when Argo Rollouts scales down an
# old ReplicaSet during a blue/green switch or a canary step.
lifecycle:
  timeout-per-shutdown-phase: 25s

shopfast:
  # Overridden per release by the Helm chart.
  release-color: ${SHOPFAST_RELEASE_COLOR:blue}
  version: ${SHOPFAST_VERSION:dev}

management:
  endpoints:
    web:
      exposure:
        # health + info + prometheus only. The management port is not exposed
        # through the ALB ingress, so scraping stays inside the cluster.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: shopfast
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
