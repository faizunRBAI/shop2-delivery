name: app-release
'on':
  workflow_dispatch: {}
jobs:
  build_test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Test and package
      run: mvn -B -ntp clean verify
      working-directory: application
  image_scan:
    runs-on: ubuntu-latest
    needs:
    - build_test
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Build the image locally for scanning
      run: docker build -t shopfast:${{ github.sha }} .
      working-directory: application
    - name: Install Trivy
      run: bash .github/scripts/install-trivy.sh
    - name: Trivy image scan
      run: bash .github/scripts/run-image-scan.sh "shopfast:${{ github.sha }}"
  push_ecr:
    runs-on: ubuntu-latest
    needs:
    - image_scan
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: shop2.royalbengal.xyz
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Build and push the immutable git-SHA tag to ECR
      run: bash .github/scripts/push-image.sh "${{ github.sha }}"
  gitops_bump:
    runs-on: ubuntu-latest
    needs:
    - push_ecr
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Bump the image tag in the GitOps values and commit
      run: bash .github/scripts/gitops-bump.sh "${{ github.sha }}"
  rollout_verify:
    runs-on: ubuntu-latest
    needs:
    - gitops_bump
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: shop2.royalbengal.xyz
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - id: tf
      name: Read the cluster name from terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cluster=$(terraform output -raw eks_cluster_name)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster }}" --region
        us-east-1
    - name: Wait for the Argo CD sync and the rollout of this SHA
      run: bash .github/scripts/verify-rollout.sh "${{ github.sha }}"
