# GENERATED by UDAP Build Project from .udap/pipeline.yaml — do not
# edit by hand; change the spec and re-render.
name: destroy
'on':
  workflow_dispatch: {}
jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: shop2.royalbengal.xyz
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Remove Kubernetes-created load balancers before destroying the VPC
      run: "# ALBs and their security groups are created by the AWS Load Balancer\n\
        # Controller and are NOT in terraform state. Left behind, they hold ENIs\n\
        # in the subnets and `terraform destroy` hangs on the VPC for ~20 minutes\n\
        # before failing. Deleting the ingresses first lets the controller clean\n\
        # up its own resources.\nCLUSTER=\"$(terraform output -raw eks_cluster_name\
        \ 2>/dev/null || true)\"\nif [ -z \"$CLUSTER\" ]; then\n  echo \"No cluster\
        \ in state \u2014 nothing to clean up.\"\n  exit 0\nfi\naws eks update-kubeconfig\
        \ --name \"$CLUSTER\" --region us-east-1 || exit 0\nkubectl delete ingress\
        \ --all --all-namespaces --ignore-not-found --timeout=5m || true\nkubectl\
        \ -n argocd delete applications --all --ignore-not-found --timeout=5m || true\n\
        echo \"Waiting for the load balancer controller to release its ENIs...\"\n\
        sleep 90\n"
      working-directory: infra
    - name: Terraform destroy
      run: terraform destroy -input=false -auto-approve
      working-directory: infra
