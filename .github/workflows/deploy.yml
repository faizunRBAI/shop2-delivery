name: deploy
'on':
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Compile the application
      run: mvn -B -ntp clean compile
      working-directory: application
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.3
    - name: Lint the chart in all three strategies
      run: "set -e\nfor strategy in standard bluegreen canary; do\n  echo \"== helm\
        \ lint (deploymentStrategy=$strategy)\"\n  helm lint application/helm/shopfast\
        \ \\\n    --set deploymentStrategy=$strategy \\\n    --set image.repository=example.dkr.ecr.us-east-1.amazonaws.com/shopfast\
        \ \\\n    --set image.tag=lintsha\ndone\n"
    - name: Assert the strategy invariant (never a Deployment with a Rollout)
      run: bash .github/scripts/assert-strategy-exclusive.sh
  test:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Unit tests
      run: mvn -B -ntp test
      working-directory: application
  security:
    runs-on: ubuntu-latest
    needs:
    - lint
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Install Trivy
      run: bash .github/scripts/install-trivy.sh
    - name: Trivy filesystem and IaC scan
      run: "set -e\n# --offline-scan: the Java analyzer otherwise resolves unknown\
        \ POMs\n# from Maven Central, which rate-limits the shared GitHub runner IP\n\
        # (HTTP 429, Retry-After 1800). Detection still runs from the local\n# vulnerability\
        \ DB; only the remote POM lookups are disabled.\n./bin/trivy fs --scanners\
        \ vuln,secret --severity HIGH,CRITICAL \\\n  --offline-scan --exit-code 0\
        \ --no-progress application\n./bin/trivy config --severity HIGH,CRITICAL --exit-code\
        \ 0 --no-progress infra\n"
  provision:
    runs-on: ubuntu-latest
    needs:
    - test
    - security
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: shop2.royalbengal.xyz
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Terraform validate
      run: terraform validate
      working-directory: infra
    - name: Create the hosted zone first and print the nameservers
      run: 'echo "Creating the Route 53 zone before anything that waits on DNS."

        terraform apply -input=false -auto-approve -target=aws_route53_zone.platform

        echo "::notice title=cPanel DNS delegation::Add these as NS records for the
        ''shop2'' subdomain in cPanel."

        terraform output -json route53_nameservers

        '
      working-directory: infra
    - name: Terraform apply
      run: terraform apply -input=false -auto-approve
      working-directory: infra
    - name: Show the provisioned endpoints
      run: 'terraform output -raw eks_cluster_name && echo

        terraform output -raw ecr_repository_url && echo

        terraform output -json route53_nameservers

        '
      working-directory: infra
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: shop2.royalbengal.xyz
      ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      GITOPS_REPO_URL: ${{ secrets.GITOPS_REPO_URL }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.16.3
    - name: Install htpasswd for the Argo CD credential hash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
        apache2-utils
    - id: tf
      name: Read the cluster name from terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cluster=$(terraform output -raw eks_cluster_name)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster }}" --region
        us-east-1
    - name: Bootstrap the AWS LB Controller, Argo CD and the App-of-Apps
      run: bash gitops/bootstrap/bootstrap.sh
      env:
        CLUSTER_NAME: ${{ steps.tf.outputs.cluster }}
        GITHUB_SHA: ${{ github.sha }}
    - name: Commit the rendered GitOps manifests
      run: bash .github/scripts/commit-rendered-gitops.sh
  verify:
    runs-on: ubuntu-latest
    needs:
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: us-east-1
      TF_VAR_base_domain: shop2.royalbengal.xyz
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
        terraform_wrapper: false
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: v1.33.0
    - id: tf
      name: Read the cluster name from terraform state
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\necho\
        \ \"cluster=$(terraform output -raw eks_cluster_name)\" >> \"$GITHUB_OUTPUT\"\
        \n"
      working-directory: infra
    - name: Update kubeconfig
      run: aws eks update-kubeconfig --name "${{ steps.tf.outputs.cluster }}" --region
        us-east-1
    - name: Verify the real AWS, EKS and Argo CD state
      run: bash gitops/bootstrap/verify.sh
