# ---------------------------------------------------------------------------
# Argo CD configuration (upstream argo-cd chart).
#
# The dashboard is published at https://argocd.shop2.royalbengal.xyz through
# ingress-nginx behind the platform NLB. TLS terminates at nginx on a
# cert-manager-issued Let's Encrypt certificate, so the Argo CD server itself
# runs in --insecure mode: it speaks plain HTTP only INSIDE the cluster, never
# on the wire. Port 80 redirects to 443 at the ingress.
#
# VERIFIED against argo-cd chart 7.7.11 with `helm template`:
#   * server.ingress.tls=true alone emits the tls block with
#     secretName: argocd-server-tls  -> do NOT also set extraTls, that
#     produces a duplicate TLS entry.
#   * configs.params."server.insecure"=true switches the ingress backend port
#     from 443 to 80. Setting insecure WITHOUT that would make nginx speak
#     plain HTTP to a TLS port and every request would 502.
#
# No kubectl port-forward is involved anywhere in this design.
# ---------------------------------------------------------------------------

global:
  domain: argocd.shop2.royalbengal.xyz

configs:
  params:
    # TLS is terminated by ingress-nginx in front; see the note above.
    # This also makes the chart target the server's port 80.
    server.insecure: true
    # Argo CD reconciles the cluster; it must not be a Rollout controller.
    application.namespaces: "argocd"

  cm:
    url: https://argocd.shop2.royalbengal.xyz
    # Teach the Argo CD UI/health system about Argo Rollouts resources so a
    # progressing canary shows as Progressing rather than Unknown.
    resource.customizations.health.argoproj.io_Rollout: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.phase == "Healthy" then
          hs.status = "Healthy"
          hs.message = "Rollout is healthy"
          return hs
        end
        if obj.status.phase == "Paused" then
          hs.status = "Suspended"
          hs.message = "Rollout is paused awaiting promotion"
          return hs
        end
        if obj.status.phase == "Degraded" then
          hs.status = "Degraded"
          hs.message = "Rollout is degraded"
          return hs
        end
      end
      hs.status = "Progressing"
      hs.message = "Rollout is progressing"
      return hs
    # Argo Rollouts writes these; they are not user intent.
    resource.customizations.ignoreDifferences.argoproj.io_Rollout: |
      jsonPointers:
        - /spec/replicas

  rbac:
    # Read-only for everyone authenticated; the admin account retains full
    # rights. Tighten further by wiring SSO and mapping groups here.
    policy.default: role:readonly
    policy.csv: |
      p, role:platform-admin, applications, *, */*, allow
      p, role:platform-admin, clusters, get, *, allow
      p, role:platform-admin, repositories, *, *, allow
      g, admin, role:platform-admin

server:
  replicas: 1

  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.shop2.royalbengal.xyz
    annotations:
      # cert-manager issues and renews the certificate for this hostname into
      # the Secret named in the chart-generated tls block (argocd-server-tls).
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # Per-ingress redirect (NOT global): ingress-nginx exempts the ACME
      # challenge path from this, so HTTP-01 renewals continue to work.
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # server.insecure=true means the pod serves plain HTTP in-cluster.
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      # The Argo CD UI streams application events over long-lived responses.
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Emits: tls: [{hosts: [<domain>], secretName: argocd-server-tls}]
    tls: true

  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

  metrics:
    enabled: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1536Mi
  metrics:
    enabled: true

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  metrics:
    enabled: true

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  # No external identity provider wired yet; local admin account is used.
  # Enabling SSO is listed as an optional enhancement in the README.
  enabled: false

redis:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
