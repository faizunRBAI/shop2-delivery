# ---------------------------------------------------------------------------
# Argo Rollouts controller.
#
# Owns Rollout resources cluster-wide. For canary releases it uses the NGINX
# traffic router: it copies the application's stable Ingress into a managed
# "-canary" Ingress and drives nginx.ingress.kubernetes.io/canary-weight as the
# rollout steps progress. That requires permission to read and write Ingress
# objects, which clusterInstall provides.
#
# There is no AWS Load Balancer Controller in this cluster — traffic splitting
# happens inside nginx, not on an ALB (see gitops/platform/ingress-nginx).
# ---------------------------------------------------------------------------

installCRDs: true

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

  metrics:
    enabled: true

# The Rollouts dashboard is an internal tool; it is NOT published on the public
# load balancer. Argo CD's own UI shows rollout progress via the health
# customization in gitops/platform/argocd/values.yaml.
dashboard:
  enabled: false

# Cluster-scoped install: grants the controller permission to read and modify
# Ingress objects so it can create and weight the canary ingress.
clusterInstall: true

serviceAccount:
  create: true
  name: argo-rollouts

notifications:
  enabled: false
