# ---------------------------------------------------------------------------
# Provisioned Grafana dashboards, version-controlled as code.
#   kubernetes.json  — cluster and node health (Kubernetes metrics)
#   shopfast.json    — Spring Boot / JVM metrics from the actuator
#   delivery.json    — deployment & rollout view (blue/green + canary split)
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  kubernetes.json: |
    {
      "title": "Kubernetes Cluster",
      "uid": "k8s-cluster",
      "tags": ["kubernetes", "platform"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "panels": [
        {
          "type": "stat", "title": "Ready nodes",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A" }]
        },
        {
          "type": "stat", "title": "Running pods",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A" }]
        },
        {
          "type": "stat", "title": "Pods not ready",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})", "refId": "A" }]
        },
        {
          "type": "stat", "title": "Container restarts (1h)",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "CPU cores used by namespace",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [{ "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))", "legendFormat": "{{namespace}}", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "Memory working set by namespace",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [{ "expr": "sum by (namespace) (container_memory_working_set_bytes{container!=\"\"})", "legendFormat": "{{namespace}}", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "Node CPU utilisation",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [{ "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))", "legendFormat": "{{instance}}", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "Pod restarts by namespace",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [{ "expr": "sum by (namespace) (increase(kube_pod_container_status_restarts_total[15m]))", "legendFormat": "{{namespace}}", "refId": "A" }]
        }
      ]
    }

  shopfast.json: |
    {
      "title": "ShopFast — Spring Boot",
      "uid": "shopfast-app",
      "tags": ["shopfast", "spring-boot"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "stat", "title": "Instances up",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "count(up{namespace=\"shopfast\"} == 1)", "refId": "A" }]
        },
        {
          "type": "stat", "title": "Request rate (req/s)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"shopfast\"}[5m]))", "refId": "A" }]
        },
        {
          "type": "stat", "title": "5xx rate (req/s)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [{ "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"shopfast\",status=~\"5..\"}[5m]))", "refId": "A" }]
        },
        {
          "type": "stat", "title": "p95 latency (s)",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [{ "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"shopfast\"}[5m])))", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "Request rate by URI",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [{ "expr": "sum by (uri) (rate(http_server_requests_seconds_count{namespace=\"shopfast\"}[5m]))", "legendFormat": "{{uri}}", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "Latency percentiles",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"shopfast\"}[5m])))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"shopfast\"}[5m])))", "legendFormat": "p95", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"shopfast\"}[5m])))", "legendFormat": "p99", "refId": "C" }
          ]
        },
        {
          "type": "timeseries", "title": "JVM heap used",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 12 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [{ "expr": "sum by (pod) (jvm_memory_used_bytes{namespace=\"shopfast\",area=\"heap\"})", "legendFormat": "{{pod}}", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "GC pause rate",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 12 },
          "targets": [{ "expr": "sum by (pod) (rate(jvm_gc_pause_seconds_sum{namespace=\"shopfast\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "Live JVM threads",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 12 },
          "targets": [{ "expr": "sum by (pod) (jvm_threads_live_threads{namespace=\"shopfast\"})", "legendFormat": "{{pod}}", "refId": "A" }]
        }
      ]
    }

  delivery.json: |
    {
      "title": "ShopFast — Delivery & Rollouts",
      "uid": "shopfast-delivery",
      "tags": ["argo", "rollouts", "delivery"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "15s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "type": "timeseries", "title": "Traffic split by release colour (req/s)",
          "description": "During a canary or blue/green switch this is where the shift becomes visible.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum by (release_color) (rate(shopfast_hello_requests_total[2m]))", "legendFormat": "{{release_color}}", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "Pods by version (image tag / git SHA)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "count by (version) (shopfast_hello_requests_total)", "legendFormat": "{{version}}", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "ShopFast replicas available",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "targets": [{ "expr": "sum(kube_replicaset_status_ready_replicas{namespace=\"shopfast\"})", "legendFormat": "ready", "refId": "A" }]
        },
        {
          "type": "timeseries", "title": "Error rate during rollout (5xx req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "targets": [{ "expr": "sum by (release_color) (rate(http_server_requests_seconds_count{namespace=\"shopfast\",status=~\"5..\"}[2m]))", "legendFormat": "{{release_color}}", "refId": "A" }]
        },
        {
          "type": "stat", "title": "Argo CD apps out of sync",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 17 },
          "targets": [{ "expr": "sum(argocd_app_info{sync_status!=\"Synced\"})", "refId": "A" }]
        },
        {
          "type": "stat", "title": "Argo CD apps unhealthy",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 17 },
          "targets": [{ "expr": "sum(argocd_app_info{health_status!=\"Healthy\"})", "refId": "A" }]
        },
        {
          "type": "stat", "title": "Argo CD sync operations (5m)",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 17 },
          "targets": [{ "expr": "sum(increase(argocd_app_sync_total[5m]))", "refId": "A" }]
        }
      ]
    }
