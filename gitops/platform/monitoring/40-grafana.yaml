# ---------------------------------------------------------------------------
# Grafana, published at https://grafana.shop2.royalbengal.xyz through
# ingress-nginx behind the platform NLB. Datasource and dashboards are
# PROVISIONED from ConfigMaps, so the dashboards are version-controlled in this
# repo rather than clicked into a database that no one can rebuild.
#
# The admin password comes from the grafana-admin Secret, created at bootstrap
# from the GRAFANA_ADMIN_PASSWORD GitHub secret — never from this file.
#
# TLS is issued for this hostname by cert-manager from Let's Encrypt over the
# HTTP-01 challenge; there is no ACM certificate anywhere in this platform.
#
# NOTE on mount paths: dashboards are mounted at /etc/grafana/dashboards, NOT
# under /var/lib/grafana, because the writable emptyDir mounted at
# /var/lib/grafana would shadow any ConfigMap nested beneath it.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: grafana
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoriametrics.monitoring.svc:8428
        isDefault: true
        jsonData:
          timeInterval: 30s
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: platform
        orgId: 1
        folder: ShopFast Platform
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # cert-manager issues and renews the certificate into grafana-tls.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Per-ingress redirect (NOT global): ingress-nginx exempts the ACME
    # challenge path, so HTTP-01 issuance and renewal keep working.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.shop2.royalbengal.xyz
      secretName: grafana-tls
  rules:
    - host: grafana.shop2.royalbengal.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.shop2.royalbengal.xyz
            # Anonymous access disabled: the dashboard is public on the
            # internet and must require a login.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /etc/grafana/dashboards
            - name: storage
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasources.yaml
                path: datasources.yaml
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: storage
          emptyDir: {}
