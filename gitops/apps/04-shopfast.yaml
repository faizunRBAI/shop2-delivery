# ---------------------------------------------------------------------------
# The ShopFast application itself.
#
# Chart source:  application/helm/shopfast in THIS repository.
# Release values: gitops/environments/production/shopfast-values.yaml — the
# single file the app-release pipeline edits when it bumps the image tag to a
# new git SHA. That commit is the entire deployment: Argo CD does the rest.
#
# WHY THIS IS A MULTI-SOURCE APPLICATION
# --------------------------------------
# Argo CD resolves helm.valueFiles RELATIVE TO THE CHART PATH and refuses to
# read a file outside it. The chart lives at application/helm/shopfast while
# the release values live at gitops/environments/production/ — two different
# directories in the same repository, which a single source cannot span.
#
# The multi-source form solves exactly this: a second source with `ref: values`
# exposes the repository root as $values, so the chart can reference a values
# file anywhere in the repo. The same pattern is used by the four platform
# Applications that overlay repo-local values onto an upstream chart.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopfast
  namespace: argocd
  annotations:
    # Syncs after argo-rollouts so the Rollout CRD already exists.
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/faizunRBAI/shop2-delivery.git
      targetRevision: main
      path: application/helm/shopfast
      helm:
        releaseName: shopfast
        valueFiles:
          - values.yaml
          - $values/gitops/environments/production/shopfast-values.yaml
    - repoURL: https://github.com/faizunRBAI/shop2-delivery.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: shopfast
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # Argo Rollouts owns replica counts during a progressive rollout; Argo CD
    # must not fight it mid-flight.
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
