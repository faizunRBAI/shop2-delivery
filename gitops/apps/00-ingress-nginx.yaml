# ---------------------------------------------------------------------------
# ingress-nginx — the cluster's single public entrypoint.
#
# SYNC WAVE -2: this must be the FIRST thing that exists. Its Service creates
# the AWS NLB, and every other component's Ingress is useless until the
# controller and its IngressClass are present. cert-manager (wave -1) also
# needs the nginx IngressClass to solve HTTP-01 challenges.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.11.3
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - $values/gitops/platform/ingress-nginx/values.yaml
    - repoURL: PLACEHOLDER_REPO_URL
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
