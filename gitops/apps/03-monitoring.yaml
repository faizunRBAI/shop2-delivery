# ---------------------------------------------------------------------------
# Observability stack: VictoriaMetrics (single node) + vmagent scrapers +
# kube-state-metrics + Grafana with provisioned datasource and dashboards.
# Managed entirely through GitOps, per the requirement.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/faizunRBAI/shop2-delivery.git
    targetRevision: main
    path: gitops/platform/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # -------------------------------------------------------------------------
  # StatefulSet volumeClaimTemplates permanent-diff.
  #
  # spec.volumeClaimTemplates is an ATOMIC list in the Kubernetes schema and
  # it is IMMUTABLE after creation. Read from the live object's managedFields,
  # argocd-controller owns it as a single opaque unit:
  #
  #   "f:volumeClaimTemplates":{}        <-- no sub-fields, compared wholesale
  #
  # The API server materialises each entry into a FULL typed PVC and writes
  # runtime state into it:
  #
  #   {"apiVersion":"v1","kind":"PersistentVolumeClaim",
  #    "metadata":{"creationTimestamp":null,"name":"storage"},
  #    "spec":{...,"volumeMode":"Filesystem"},
  #    "status":{"phase":"Pending"}}     <-- not expressible in git
  #
  # So the array can never match what git declares, and being immutable it can
  # never be applied away either: the Application sits at OutOfSync/Healthy
  # forever while every sync reports "successfully synced (all tasks run)".
  # A narrower pointer at .../0/status was tried first and did NOT converge —
  # normalising a child of an atomic field does not change the parent's
  # comparison. The whole array is the correct scope.
  #
  # What this does NOT hide: image, args, probes, resources, replicas,
  # securityContext, updateStrategy and every other field are still diffed
  # normally, so genuine drift is still caught. Changing the storage request
  # requires recreating the StatefulSet regardless, since the field is
  # immutable — Argo could not apply such a change in place either way.
  # -------------------------------------------------------------------------
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: victoriametrics
      namespace: monitoring
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
